slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.025
    max_laser_range: 2.0
    minimum_time_interval: 0.05
    transform_publish_period: 0.02
    map_update_interval: 0.25
    minimum_travel_distance: 0.015
    minimum_travel_heading: 0.02
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 4.0
    link_match_minimum_response_fine: 0.08
    link_scan_maximum_distance: 0.45
    loop_search_maximum_distance: 0.75
    do_loop_closing: true
    loop_match_minimum_chain_size: 6
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.25
    loop_match_minimum_response_fine: 0.35
    correlation_search_space_dimension: 0.35
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.04
    loop_search_space_dimension: 1.0
    loop_search_space_resolution: 0.02
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
